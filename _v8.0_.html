<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>นายฮ้อย | แพลตฟอร์มติวสอบตำรวจ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;900&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--br:#c2410c;--br2:#9a3412;--br3:#ea580c;--lt:#fff7ed;--lt2:#ffedd5;--bd:#fed7aa;--tx:#292524;--mu:#78716c;--ok:#15803d;--bad:#b91c1c;--wn:#b45309;--bg:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--tx);line-height:1.62;overflow-x:hidden}
.wm{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wm span{position:absolute;font-size:11px;font-weight:700;color:rgba(194,65,12,.032);white-space:nowrap;transform:rotate(-22deg)}
header,main,footer{position:relative;z-index:1}
svg.art{vertical-align:middle}
.topbar{background:var(--br);color:#fff;font-size:12.5px;text-align:center;padding:7px 14px;letter-spacing:.3px;font-weight:600}
header{background:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--bd);box-shadow:0 2px 14px rgba(194,65,12,.06)}
.nav{max-width:1180px;margin:auto;display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;cursor:pointer;color:var(--br);letter-spacing:.2px}
.nav a{color:#57534e;text-decoration:none;font-size:14.3px;font-weight:600;cursor:pointer;padding:5px 2px;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--br)}
.nav a.active{color:var(--br);border-color:var(--br3)}
.sp{flex:1}
.pill{background:var(--lt2);border:1px solid var(--bd);color:var(--br);padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:700}
.trk{background:#fff;color:var(--br);border:1.5px solid var(--bd);border-radius:9px;padding:6px 11px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
main{max-width:1180px;margin:auto;padding:24px 18px 60px}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(194,65,12,.05)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(225px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
h1{font-size:30px;font-weight:900;line-height:1.3;color:var(--br2)}
h2{font-size:20px;font-weight:800;margin-bottom:11px;color:var(--br2)}
h3{font-size:16px;font-weight:700;color:var(--tx)}
.mu{color:var(--mu);font-size:13.5px}
.sec-t{display:flex;align-items:center;gap:11px;margin:30px 0 14px}
.sec-t:before{content:"";width:5px;height:24px;background:linear-gradient(var(--br3),var(--br));border-radius:3px}
.sec-t h2{margin:0}
.btn{border:0;border-radius:10px;padding:11px 20px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:.17s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-p{background:var(--br3);color:#fff;box-shadow:0 4px 14px rgba(234,88,12,.28)}
.btn-p:hover{background:var(--br)}
.btn-d{background:var(--br2);color:#fff}
.btn-o{background:#fff;color:var(--br);border:1.7px solid var(--br3)}
.btn-o:hover{background:var(--lt)}
.btn-g2{background:#fff;color:#3c4043;border:1.5px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-r{background:#fee2e2;color:var(--bad)}.btn-g{background:#dcfce7;color:var(--ok)}
.btn-s{padding:7px 13px;font-size:12.8px;border-radius:8px}
/* hero slider */
.hero{background:linear-gradient(160deg,var(--lt) 0%,#ffe8d6 100%);border-radius:0;margin:-24px -18px 0;padding:34px 18px 40px}
.hero-in{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center}
@media(max-width:900px){.hero-in{grid-template-columns:1fr}}
.kicker{font-size:12.5px;font-weight:800;letter-spacing:1.6px;color:var(--br);text-transform:uppercase;margin-bottom:12px}
.hero h1{font-size:42px;line-height:1.16;color:#1c1917;font-weight:900}
.hero h1 em{font-style:italic;color:var(--br)}
.hero p{color:#57534e;font-size:16px;margin:16px 0 22px;max-width:520px}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap}
.hero small{display:block;color:var(--mu);font-size:12.5px;margin-top:14px}
.sld{border-radius:16px;overflow:hidden;border:1px solid var(--bd);background:#fff;position:relative;box-shadow:0 14px 40px rgba(194,65,12,.15)}
.sl{display:none}.sl.on{display:block;animation:fd .5s}
@keyframes fd{from{opacity:.2}to{opacity:1}}
.sl img,.sl video,.sl iframe{width:100%;display:block;border:0;aspect-ratio:16/10.5;object-fit:cover;background:#1c0d08}
.sl-empty{aspect-ratio:16/10.5;display:grid;place-items:center;background:linear-gradient(140deg,var(--br2),var(--br3));color:#ffedd5;text-align:center;padding:22px}
.sl-cap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;background:linear-gradient(transparent,rgba(40,12,4,.55) 40%,rgba(40,12,4,.9));color:#fff}
.sl-cap b{display:block;font-size:17px;margin-bottom:3px}
.sl-cap span{font-size:12.8px;color:#ffe4cf}
.dots{position:absolute;right:14px;bottom:13px;display:flex;gap:6px;z-index:5}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.5);cursor:pointer;transition:.2s}
.dots i.on{background:#fff;width:22px}
.sarw{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--br);border:0;font-size:17px;cursor:pointer;z-index:5;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sarw:hover{background:var(--br3);color:#fff}
.sarw.l{left:11px}.sarw.r{right:11px}
/* countdown */
.cdw{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
.cdc{background:#fff;border:1px solid var(--bd);border-radius:15px;padding:16px;box-shadow:0 3px 12px rgba(194,65,12,.06)}
.cdc .nm{font-size:14px;font-weight:800;color:var(--br2);display:flex;align-items:center;gap:8px}
.cdc .dt{font-size:11.8px;color:var(--mu);margin:3px 0 11px}
.cdn{display:flex;gap:6px}
.cdn div{flex:1;background:var(--lt);border:1px solid var(--bd);border-radius:10px;padding:7px 2px;text-align:center}
.cdn b{display:block;font-size:20px;font-weight:900;color:var(--br);font-variant-numeric:tabular-nums}
.cdn span{font-size:10.5px;color:var(--mu)}
.cd-over{background:#dcfce7;color:var(--ok);text-align:center;padding:11px;border-radius:10px;font-weight:700}
/* stats */
.stbar{background:linear-gradient(135deg,var(--br2),var(--br3));border-radius:18px;padding:26px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(194,65,12,.22)}
.stbar:after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.07)}
.stc{text-align:center;position:relative}
.stc b{display:block;font-size:33px;font-weight:900;line-height:1.15;color:#fff}
.stc span{font-size:13.5px;color:#ffe4cf}
.stc em{font-style:normal;font-size:11.5px;color:#ffcfae;display:block;margin-top:3px}
/* misc */
.sj{cursor:pointer;transition:.19s;border-top:4px solid var(--br3)}
.sj:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(194,65,12,.14)}
.chip{display:inline-block;background:var(--lt2);color:var(--br);border-radius:99px;padding:3px 10px;font-size:11.4px;font-weight:700;margin:2px 4px 2px 0}
.chip.ok{background:#dcfce7;color:var(--ok)}.chip.bad{background:#fee2e2;color:var(--bad)}.chip.w{background:#fef3c7;color:var(--wn)}
.chip.gy{background:#f5f5f4;color:var(--mu)}
.bar{height:7px;background:var(--lt2);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--br),var(--br3))}
.lk{position:relative;opacity:.72}.lk:after{content:"🔒";position:absolute;top:12px;right:14px;font-size:16px}
.bkc{display:flex;gap:14px;background:#fff;border:1px solid var(--bd);border-radius:15px;padding:15px;cursor:pointer;transition:.19s}
.bkc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(194,65,12,.13);border-color:var(--br3)}
.bkc img{width:86px;height:116px;object-fit:cover;border-radius:9px;border:1px solid var(--bd);flex-shrink:0;background:var(--lt2)}
.bkc h4{font-size:15.3px;font-weight:800;color:var(--br2);margin-bottom:4px;line-height:1.35}
.cta{background:linear-gradient(135deg,var(--br2),var(--br3));border-radius:20px;padding:40px 24px;text-align:center;color:#fff;margin-top:34px;box-shadow:0 12px 32px rgba(194,65,12,.25)}
.cta h2{font-size:29px;color:#fff;margin-bottom:9px}
.cta p{color:#ffe4cf;margin-bottom:20px;font-size:15.5px}
.cta .btn-p{background:#fff;color:var(--br)}
.cta .btn-p:hover{background:var(--lt2)}
/* exam */
.eb{position:sticky;top:60px;z-index:40;background:linear-gradient(135deg,var(--br2),var(--br3));color:#fff;border-radius:14px;padding:12px 17px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:16px}
.tm{font-weight:900;font-size:19px;color:#fff;font-variant-numeric:tabular-nums}
.tm.dg{color:#fecaca;animation:bk 1s infinite}@keyframes bk{50%{opacity:.35}}
.exl{display:grid;grid-template-columns:1fr 296px;gap:16px;align-items:start}
@media(max-width:920px){.exl{grid-template-columns:1fr}}
.qb{border:1px solid var(--bd);border-radius:14px;padding:18px;background:#fff;margin-bottom:13px}
.qn{font-size:12px;font-weight:800;color:var(--br3)}
.qt{font-size:16.2px;font-weight:600;margin:8px 0 14px;white-space:pre-wrap}
.op{display:flex;gap:10px;align-items:flex-start;border:1.6px solid var(--bd);border-radius:11px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:14.6px;transition:.12s}
.op:hover{border-color:var(--br3);background:var(--lt)}
.op.se{border-color:var(--br3);background:var(--lt2)}
.op.ri{border-color:var(--ok);background:#dcfce7}.op.wr{border-color:var(--bad);background:#fee2e2}
.op b{min-width:22px;height:22px;border-radius:7px;background:var(--lt2);display:grid;place-items:center;font-size:11.5px;flex-shrink:0;margin-top:1px;color:var(--br)}
.ex{border-left:4px solid var(--br3);background:var(--lt);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13.6px;margin-top:10px}
.omr{background:#fff;border:2px solid var(--br3);border-radius:13px;padding:14px;position:sticky;top:124px;box-shadow:0 6px 20px rgba(194,65,12,.1)}
.omr-h{text-align:center;border-bottom:2px solid var(--br3);padding-bottom:9px;margin-bottom:10px}
.omr-h .t{font-weight:900;color:var(--br);font-size:16px}
.omr-h .s{font-size:11.4px;color:var(--mu);line-height:1.55;margin-top:4px}
.omr-c{display:flex;gap:4px;font-size:10.5px;color:var(--mu);justify-content:flex-end;padding-right:4px;margin-bottom:4px}
.omr-c span{width:25px;text-align:center;font-weight:700}
.omr-l{max-height:calc(100vh - 320px);overflow-y:auto;padding-right:4px}
.omr-r{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dotted var(--bd)}
.omr-r.now{background:var(--lt2);border-radius:7px}
.omr-r .no{width:27px;font-size:11.8px;font-weight:700;color:var(--mu);text-align:right;cursor:pointer}
.bb{width:25px;height:25px;border-radius:50%;border:1.7px solid var(--br3);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--br);cursor:pointer;background:#fff;flex-shrink:0}
.bb:hover{background:var(--lt2)}
.bb.f{background:var(--br3);color:#fff;border-color:var(--br);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px var(--br3)}
.omr-ft{border-top:2px solid var(--br3);margin-top:9px;padding-top:8px;font-size:11.5px;color:var(--mu);text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 11px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{background:var(--lt);font-weight:700;font-size:12.5px;color:var(--br2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* result */
.rs{background:#fff;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden;max-width:930px;margin:auto;font-family:'Sarabun',sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.09)}
.rs-h{background:linear-gradient(135deg,var(--br2),var(--br3));color:#fff;padding:13px 18px;font-weight:700;font-size:18px;text-align:center}
.rs-b{padding:22px 20px}
.rs-i{text-align:center;font-size:15px;line-height:2.1;margin:0 auto 18px;max-width:540px}
.rs-i div{display:flex;justify-content:center;gap:12px}
.rs-i span{color:#57534e}.rs-i b{color:#111}
.rt{border-collapse:collapse;width:100%;font-size:13px;font-family:'Sarabun',sans-serif}
.rt th,.rt td{border:1px solid #94a3b8;padding:7px 4px;text-align:center}
.rt th{background:#f8fafc;color:#1e3a8a;font-weight:700;font-size:12.2px;line-height:1.3}
.rt th.g{color:var(--ok)}.rt th.r{color:var(--bad)}
.rt td{font-size:14.5px;font-weight:600;color:#222}
.vd{color:var(--bad);font-weight:700;font-size:12.8px;line-height:1.45}
.vd.pass{color:var(--ok)}
/* pricing */
.pk{background:#fff;border:2px solid var(--bd);border-radius:18px;padding:26px 22px;text-align:center;position:relative;transition:.2s}
.pk:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(194,65,12,.14)}
.pk.best{border-color:var(--br3);box-shadow:0 12px 32px rgba(234,88,12,.18)}
.pk .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--br3);color:#fff;font-size:12px;font-weight:800;padding:4px 17px;border-radius:99px;white-space:nowrap}
.pk .old{text-decoration:line-through;color:#a8a29e;font-size:16px}
.pk .now{font-size:38px;font-weight:900;color:var(--br);line-height:1.1}
.pk ul{list-style:none;text-align:left;margin:16px 0;font-size:14px}
.pk li{padding:5px 0 5px 24px;position:relative}
.pk li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:900}
.gate{max-width:580px;margin:30px auto}
.gcard{background:#fff;border-radius:20px;padding:30px 24px;text-align:center;border-top:6px solid var(--br3);box-shadow:0 14px 38px rgba(194,65,12,.13)}
.warn{background:#fffbeb;border:1.5px solid var(--wn);color:#92400e;border-radius:13px;padding:12px 16px;margin-bottom:16px;font-size:14px;display:flex;gap:10px;align-items:center}
.mask{position:fixed;inset:0;background:rgba(41,25,20,.6);display:grid;place-items:center;z-index:100;padding:16px;overflow:auto;backdrop-filter:blur(2px)}
.md{background:#fff;border-radius:18px;padding:25px;max-width:540px;width:100%;max-height:92vh;overflow:auto;border-top:6px solid var(--br3);box-shadow:0 20px 50px rgba(0,0,0,.2)}
.md.w{max-width:860px}
input,select,textarea{width:100%;padding:10px 13px;border:1.6px solid var(--bd);border-radius:10px;font-family:inherit;font-size:14.5px;margin-top:5px;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--br3)}
textarea{min-height:85px;resize:vertical}
label{font-size:13px;font-weight:700;display:block;margin-top:12px;color:#44403c}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.tst{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--br2);color:#fff;padding:12px 22px;border-radius:12px;z-index:200;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.ab{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.ab button{border:1.5px solid var(--bd);background:#fff;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:13.4px;font-weight:700;cursor:pointer;color:#57534e}
.ab button.on{background:var(--br3);color:#fff;border-color:var(--br3)}
.seg{display:flex;border:2px solid var(--br3);border-radius:12px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;background:#fff;color:var(--br);padding:11px;font-family:inherit;font-size:14.3px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{background:var(--br3);color:#fff}
.kpi{background:var(--lt);border:1px solid var(--bd);border-radius:14px;padding:16px}
.kpi b{display:block;font-size:26px;font-weight:900;color:var(--br)}
code{background:var(--lt2);padding:2px 6px;border-radius:5px;font-size:12.5px;color:var(--br)}
.dv{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:11px;padding:10px 12px;margin-top:7px;font-size:13.4px}
.sw{display:flex;align-items:center;gap:9px;margin-top:6px}
.sw input[type=color]{width:48px;height:36px;padding:2px;margin:0}
.slip{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
footer{background:#1c1917;color:#d6d3d1;padding:34px 18px 24px;margin-top:44px;border-top:4px solid var(--br3)}
.fin{max-width:1180px;margin:auto;text-align:center}
.soc{display:flex;justify-content:center;gap:14px;margin:14px 0}
.soc a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(254,215,170,.25);transition:.2s;text-decoration:none}
.soc a:hover{background:var(--br3);transform:translateY(-3px)}
.soc svg{width:21px;height:21px;fill:#fed7aa}
.soc a:hover svg{fill:#fff}
.admdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#44403c;cursor:pointer;margin-top:14px;opacity:.5}
@media(max-width:700px){.hero h1{font-size:29px}.nav a{font-size:12.8px}h1{font-size:23px}}
@media print{header,footer,.np,.topbar{display:none!important}main{padding:0}.rs{box-shadow:none;border:0}.wm{display:none}}
</style>
</head>
<body>
<div class="wm" id="wm"></div>
<div class="topbar" id="tb"></div>
<header><div class="nav" id="nav"></div></header>
<main id="app"></main>
<footer><div class="fin" id="ft"></div></footer>
<div id="mh"></div>
<script>
/* ============ ART ============ */

const KEY='naihoi_v8',DK='naihoi_dev8',LK='naihoi_lock';
let D=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('พื้นที่เก็บข้อมูลเต็ม')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function devId(){let d=localStorage.getItem(DK);if(!d){d='DEV-'+uid().toUpperCase();localStorage.setItem(DK,d)}return d}
function devName(){const u=navigator.userAgent;const o=/iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'อื่นๆ';const b=/Edg/.test(u)?'Edge':/Chrome/.test(u)?'Chrome':/Safari/.test(u)?'Safari':/Firefox/.test(u)?'Firefox':'Browser';return o+' • '+b}
/* anti brute-force */
function lockInfo(){try{return JSON.parse(localStorage.getItem(LK)||'{"n":0,"t":0}')}catch(e){return{n:0,t:0}}}
function lockAdd(){const l=lockInfo();l.n++;if(l.n>=5)l.t=Date.now()+5*60000;localStorage.setItem(LK,JSON.stringify(l));return l}
function lockClear(){localStorage.removeItem(LK)}
function lockBlocked(){const l=lockInfo();return l.t&&Date.now()<l.t?Math.ceil((l.t-Date.now())/1000):0}

function applyTheme(){const t=D.settings.theme,r=document.documentElement.style;
 r.setProperty('--br',t.main);r.setProperty('--br3',t.accent);r.setProperty('--br2',shade(t.main,-18))}
function shade(h,p){const n=parseInt(h.slice(1),16);let r=(n>>16)+Math.round(255*p/100),g=(n>>8&255)+Math.round(255*p/100),b=(n&255)+Math.round(255*p/100);
 r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
 return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

 const m=D.settings.media.filter(x=>x.type==='none'||x.url);
 if(!m.length)return `<div class="sld"><div class="sl-empty">${IC('badge',66)}<div style="margin-top:10px;font-weight:700">นายฮ้อย</div></div></div>`;
 return `<div class="sld">
  ${m.map((x,i)=>{let in_='';
   if(x.type==='image'&&x.url)in_=`<img src="${esc(x.url)}" alt="">`;
   else if(x.type==='video'&&x.url)in_=`<video src="${esc(x.url)}" autoplay muted loop playsinline></video>`;
   else if(x.type==='youtube'&&x.url)in_=`<iframe src="https://www.youtube.com/embed/${esc(x.url)}?rel=0" allowfullscreen></iframe>`;
   else in_=`<div class="sl-empty">${IC('badge',66)}</div>`;
   return `<div class="sl ${i===0?'on':''}">${in_}${(x.title||x.sub)?`<div class="sl-cap"><b>${esc(x.title||'')}</b><span>${esc(x.sub||'')}</span></div>`:''}</div>`}).join('')}
  ${m.length>1?`<button class="sarw l" onclick="slGo(-1)">‹</button><button class="sarw r" onclick="slGo(1)">›</button>
  <div class="dots">${m.map((_,i)=>`<i class="${i===0?'on':''}" onclick="slSet(${i})"></i>`).join('')}</div>`:''}</div>`}
function slSet(i){const s=document.querySelectorAll('.sl'),d=document.querySelectorAll('.dots i');
 if(!s.length)return;s.forEach(x=>x.classList.remove('on'));d.forEach(x=>x.classList.remove('on'));
 slIdx=(i+s.length)%s.length;s[slIdx].classList.add('on');if(d[slIdx])d[slIdx].classList.add('on')}
function slGo(d){slSet(slIdx+d)}
function startSlide(){if(slT)clearInterval(slT);slIdx=0;
 if(document.querySelectorAll('.sl').length<2)return;slT=setInterval(()=>slSet(slIdx+1),5200)}
function cdHTML(){
 const ev=D.exams.filter(e=>e.date);
 if(!ev.length)return '';
 return `<div class="sec-t"><h2>นับถอยหลังวันสอบ</h2></div>
 <div class="cdw">${ev.map(e=>`<div class="cdc" data-t="${new Date(e.date).getTime()}">
  <div class="nm">${IC(e.ln?LN(e.ln)?.icon||'badge':TR(e.tr).icon,22)} ${esc(e.name)}</div>
  <div class="dt">สอบวันที่ ${thF(e.date)}</div>
  <div class="cdn"><div><b>–</b><span>วัน</span></div><div><b>–</b><span>ชม.</span></div><div><b>–</b><span>นาที</span></div><div><b>–</b><span>วิ</span></div></div></div>`).join('')}</div>`}
function startCd(){if(cdT)clearInterval(cdT);
 const tick=()=>{document.querySelectorAll('.cdc').forEach(c=>{
  const t=+c.dataset.t,df=t-Date.now(),box=c.querySelector('.cdn');if(!box)return;
  if(df<=0){box.outerHTML='<div class="cd-over">ถึงวันสอบแล้ว — ขอให้โชคดี!</div>';return}
  const d=Math.floor(df/864e5),h=Math.floor(df/36e5)%24,m=Math.floor(df/6e4)%60,s=Math.floor(df/1e3)%60;
  const b=box.querySelectorAll('b');b[0].textContent=d;b[1].textContent=String(h).padStart(2,'0');
  b[2].textContent=String(m).padStart(2,'0');b[3].textContent=String(s).padStart(2,'0')})};
 tick();cdT=setInterval(tick,1000)}

async function doReg(){
 const n=v('rn'),s=v('rs'),b=v('rbd'),t=v('rt'),e=v('re').toLowerCase(),p=v('rp'),p2=v('rp2');
 if(!n||!s)return toast('กรอกชื่อและนามสกุล');
 if(!e||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))return toast('กรอกอีเมลให้ถูกต้อง');
 if(!t||t.replace(/\D/g,'').length<9)return toast('กรอกเบอร์โทรให้ถูกต้อง');
 if(!p||p.length<6)return toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
 if(p!==p2)return toast('ยืนยันรหัสผ่านไม่ตรงกัน');
 if(D.users.some(x=>x.email===e))return toast('อีเมลนี้สมัครไว้แล้ว กรุณาเข้าสู่ระบบ');
 const salt=uid();
 const u={id:uid(),code:'NH'+String(D.users.filter(x=>x.role!=='admin').length+1).padStart(4,'0'),
  name:n,sur:s,birth:b,tel:t,email:e,pass:await sha(p+salt),salt,role:'user',status:'free',
  wantTr:v('rtr'),wantLn:v('rln'),access:{sg:{on:false,expire:null},cd:{on:false,expire:null}},
  devices:[],maxDev:D.settings.maxDevices,banned:false,createdAt:Date.now(),history:[],trial:{d:'',n:0}};
 D.users.push(u);save();enter(u);toast('สมัครสมาชิกสำเร็จ! เริ่มทดลองใช้ฟรีได้เลย')}

 save();cm();go('home')}

/* ============ EXAM ENGINE ============ */
function drawRandom(pool,n){
 const mix=D.settings.mix,tt=(mix.e+mix.m+mix.h)||100;
 const want={e:Math.round(n*mix.e/tt),m:Math.round(n*mix.m/tt),h:Math.round(n*mix.h/tt)};
 const bank={e:shuf(pool.filter(q=>q.diff==='e')),m:shuf(pool.filter(q=>q.diff==='m')),h:shuf(pool.filter(q=>q.diff==='h'))};
 let pk=[];['e','m','h'].forEach(k=>{const b=bank[k];for(let i=0;i<want[k];i++){if(!b.length)break;pk.push(b[i%b.length])}});
 const rest=shuf(pool);let i=0;while(pk.length<n&&rest.length){pk.push(rest[i%rest.length]);i++}
 return shuf(pk).slice(0,n)}
const mapQ=(s,mix)=>{if(mix){const m=shuf(s.o.map((t,j)=>({t,ok:j===s.a})));

async function uSave(id){
 const n=v('un'),e=v('ue').toLowerCase();
 if(!n||!e)return toast('กรอกชื่อและอีเมล');
 if(D.users.some(x=>x.id!==id&&x.email===e))return toast('อีเมลนี้ถูกใช้แล้ว');
 const acc={};D.tracks.forEach(t=>{const on=ck('ea_'+t.id),x=v('ex_'+t.id);
  acc[t.id]={on,expire:x?new Date(x).getTime():(on?Date.now()+30*864e5:null)}});
 const o={code:v('uc'),name:n,sur:v('us'),birth:v('ubd'),tel:v('ut'),email:e,access:acc,maxDev:+v('um')||2,role:v('ur')};
 if(id)Object.assign(D.users.find(x=>x.id===id),o);
 else{const p=v('up')||'123456',salt=uid();
  D.users.push({id:uid(),...o,pass:await sha(p+salt),salt,status:'free',devices:[],banned:false,createdAt:Date.now(),history:[],trial:{d:'',n:0}})}
 save();cm();render();toast('บันทึกแล้ว')}

 u.access[tr]={on:true,expire:base+d*864e5};u.status='pro';save();render();toast(`ต่ออายุสาย${TR(tr).short} อีก ${d} วัน`)}

 if(qS)L=L.filter(q=>(q.q+q.o.join()+q.e).toLowerCase().includes(qS.toLowerCase()));
 L=L.sort((a,b)=>(a.subj+a.set).localeCompare(b.subj+b.set)||(a.ord||0)-(b.ord||0));

function qSv(id){
 const o=[0,1,2,3].map(i=>v('fo'+i)),qq=v('fq'),sid=v('fs'),st=v('fset')||'1';
 if(!qq||o.some(x=>!x))return toast('กรอกโจทย์และตัวเลือกให้ครบ');
 if(!id&&D.questions.some(x=>qk(x.subj,x.set,x.q)===qk(sid,st,qq)))return toast('มีข้อสอบนี้อยู่แล้วในชุดเดียวกัน');
 const maxOrd=Math.max(0,...D.questions.filter(x=>x.subj===sid&&x.set===st).map(x=>x.ord||0));
 const ob={subj:sid,set:st,q:qq,o,a:+v('fa'),e:v('fe'),diff:v('fd')||'m',active:ck('fc')};
 if(id)Object.assign(D.questions.find(x=>x.id===id),ob);
 else D.questions.push({id:uid(),ord:maxOrd+1,...ob});

 const sid=v('bs'),st=v('bst')||'1';

 <label><input type="checkbox" id="pb" ${p.best?'checked':''} style="width:auto;margin-right:7px">ติดป้าย "คุ้มที่สุด"</label>
 <button class="btn btn-p" style="width:100%;margin-top:14px" onclick="pmSv('${p.id}','${id?'1':''}')">บันทึก</button>
 <button class="btn btn-o" style="width:100%;margin-top:8px" onclick="cm()">ยกเลิก</button>`)}
function pmSv(id,edit){
 const o={id,tr:v('pt'),per:v('pp'),title:v('ptt'),old:+v('pol')||0,price:+v('ppr')||0,best:ck('pb')?1:0,
  feat:document.getElementById('pf').value.split('\n').map(x=>x.trim()).filter(Boolean)};
 if(!o.title)return toast('กรอกชื่อแพ็กเกจ');
 const old=D.promos.find(x=>x.id===id);if(edit&&old)Object.assign(old,o);else D.promos.push(o);
 save();cm();render();toast('บันทึกแล้ว')}
function cpEd(id){const c=id?D.coupons.find(x=>x.id===id):{id:uid(),code:'',type:'baht',val:0,note:''};
 modal(`<h2>${id?'แก้ไขโค้ด':'เพิ่มโค้ดส่วนลด'}</h2>
 <label>โค้ด (ตัวพิมพ์ใหญ่)</label><input id="cc" value="${esc(c.code)}">
 <label>ประเภทส่วนลด</label><select id="cty"><option value="baht" ${c.type==='baht'?'selected':''}>ลดเป็นบาท</option><option value="pct" ${c.type==='pct'?'selected':''}>ลดเป็นเปอร์เซ็นต์</option></select>
 <label>จำนวนที่ลด</label><input id="cv" type="number" value="${c.val}">
 <label>หมายเหตุ</label><input id="cn" value="${esc(c.note||'')}">
 <button class="btn btn-p" style="width:100%;margin-top:14px" onclick="cpSv('${c.id}','${id?'1':''}')">บันทึก</button>
 <button class="btn btn-o" style="width:100%;margin-top:8px" onclick="cm()">ยกเลิก</button>`)}
function cpSv(id,edit){const o={id,code:v('cc').toUpperCase(),type:v('cty'),val:+v('cv')||0,note:v('cn')};
 if(!o.code)return toast('กรอกโค้ด');
 const old=D.coupons.find(x=>x.id===id);if(edit&&old)Object.assign(old,o);else D.coupons.push(o);
 save();cm();render();toast('บันทึกแล้ว')}
function aSet(){const s=D.settings,t=s.theme,soc=s.social;
 return `<div class="grid g2">
 <div class="card"><h2>ข้อความและหน้าตาเว็บ</h2>
  <label>ชื่อเว็บ</label><input id="gN" value="${esc(s.appName)}">
  <label>แถบประกาศด้านบนสุด</label><input id="gTB" value="${esc(s.topbar||'')}">
  <label>Kicker (ข้อความเล็กเหนือหัวเรื่อง)</label><input id="gTag" value="${esc(s.tagline)}">
  <label>หัวเรื่องหน้าแรก</label><input id="gHT" value="${esc(s.heroTitle)}">
  <label>คำโปรยหน้าแรก</label><textarea id="gHS">${esc(s.heroSub)}</textarea>
  <label>ช่องทางติดต่อ (ท้ายเว็บ)</label><input id="gC" value="${esc(s.contact)}">
  <label>หน่วยที่นั่งเขียนสอบ (ใบผลสอบ)</label><input id="gR" value="${esc(s.examRoom)}">
  <label>ข้อความหัวกระดาษคำตอบ</label><input id="gO" value="${esc(s.omrTitle)}">
  <label>สีหลัก (ส้มอิฐ)</label><div class="sw"><input type="color" id="c1" value="${t.main}"><input value="${t.main}" id="c1t" oninput="document.getElementById('c1').value=this.value"></div>
  <label>สีเน้น</label><div class="sw"><input type="color" id="c2" value="${t.accent}"><input value="${t.accent}" id="c2t" oninput="document.getElementById('c2').value=this.value"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:11px">
   <button class="btn btn-o btn-s" onclick="preset('#c2410c','#ea580c')">ส้มอิฐคลาสสิก</button>
   <button class="btn btn-o btn-s" onclick="preset('#9a3412','#f97316')">ส้มเข้มหรู</button>
   <button class="btn btn-o btn-s" onclick="preset('#b45309','#f59e0b')">ส้มทอง</button></div>
  <button class="btn btn-p" style="width:100%;margin-top:15px" onclick="setSave()">บันทึกการตั้งค่า</button></div>
 <div class="card"><h2>ลิงก์โซเชียล (ท้ายทุกหน้า)</h2>
  <label>Facebook</label><input id="soFb" value="${esc(soc.fb)}">
  <label>TikTok</label><input id="soTt" value="${esc(soc.tt)}">
  <label>LINE</label><input id="soLn" value="${esc(soc.line)}">
  <button class="btn btn-d" style="width:100%;margin-top:13px" onclick="D.settings.social={fb:v('soFb'),tt:v('soTt'),line:v('soLn')};save();render();toast('บันทึกลิงก์แล้ว')">บันทึกลิงก์</button>
  <h2 style="margin-top:22px">ตัวเลขความน่าเชื่อถือ</h2>
  <label>บวกเพิ่มจากค่าจริง</label><input id="gB" type="number" value="${s.boost}">
  <h2 style="margin-top:20px">สิทธิ์ทดลองใช้ฟรี</h2>
  <div class="row2"><div><label>ชุดต่อวัน</label><input id="fS" type="number" value="${s.freeSet}"></div>
  <div><label>ข้อต่อชุด</label><input id="fQ" type="number" value="${s.freeQ}"></div></div>
  <h2 style="margin-top:20px">สัดส่วนสุ่มยากง่าย (ใช้กับชุดสุ่มและสนามจำลอง)</h2>
  <div class="row2"><div><label>ง่าย %</label><input id="mE" type="number" value="${s.mix.e}"></div>
  <div><label>กลาง %</label><input id="mM" type="number" value="${s.mix.m}"></div>
  <div><label>ยาก %</label><input id="mH" type="number" value="${s.mix.h}"></div></div>
  <button class="btn btn-d" style="width:100%;margin-top:13px" onclick="misc()">บันทึกค่าเหล่านี้</button></div>
 <div class="card"><h2>สายสอบและเกณฑ์</h2>
  ${D.tracks.map((t2,i)=>`<div style="border:1.5px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:12px">
   <div style="display:flex;align-items:center;gap:10px">${IC(t2.icon,30)}<b>${esc(t2.name)}</b></div>
   <div class="row2"><div><label>เวลาสอบ (นาที)</label><input id="tm${i}" type="number" value="${t2.min}"></div>
   <div><label>ตัวจริง %</label><input id="tp${i}" type="number" value="${t2.pass}"></div>
   <div><label>ตัวสำรอง %</label><input id="tv${i}" type="number" value="${t2.res}"></div></div>
   <div style="margin-top:9px">${LNSof(t2.id).map(l=>`<span class="chip">${esc(l.name)} · ${TOT(t2.id,l.id)} ข้อ</span>`).join('')}</div></div>`).join('')}
  <button class="btn btn-p" style="width:100%" onclick="trSv()">บันทึกเกณฑ์สายสอบ</button></div>
 <div class="card"><h2>จำนวนข้อรายวิชา (สนามจำลอง)</h2>
  <div class="tw"><table><tr><th style="width:64px">สาย</th><th style="width:130px">สายงาน</th><th>วิชา</th><th style="width:46px">กลุ่ม</th><th style="width:60px">ข้อ</th></tr>
  ${D.subjects.filter(s2=>!s2.old).map((x,i)=>`<tr><td>${esc(TR(x.tr).short)}</td><td class="mu" style="font-size:12px">${esc(LN(x.ln)?.name||'')}</td>
   <td><input id="vn${i}" value="${esc(x.name)}"></td>
   <td><select id="vg${i}"><option ${x.grp==='A'?'selected':''}>A</option><option ${x.grp==='B'?'selected':''}>B</option></select></td>
   <td><input id="vq${i}" type="number" value="${x.n}"></td></tr>`).join('')}
  </table></div>
  <button class="btn btn-d" style="width:100%;margin-top:12px" onclick="sjSv()">บันทึกวิชา</button></div></div>`}
function preset(a,b){document.getElementById('c1').value=a;document.getElementById('c1t').value=a;
 document.getElementById('c2').value=b;document.getElementById('c2t').value=b;
 D.settings.theme={main:a,accent:b};save();applyTheme();toast('เปลี่ยนชุดสีแล้ว — กดบันทึกเพื่อยืนยัน')}
function setSave(){const s=D.settings;
 s.appName=v('gN')||s.appName;s.topbar=v('gTB');s.tagline=v('gTag');s.heroTitle=v('gHT');
 s.heroSub=document.getElementById('gHS').value;s.contact=v('gC');s.examRoom=v('gR')||'นายฮ้อย';s.omrTitle=v('gO')||'กระดาษคำตอบ';
 s.theme={main:document.getElementById('c1').value,accent:document.getElementById('c2').value};
 save();applyTheme();render();toast('บันทึกแล้ว')}
function misc(){const s=D.settings;
 s.boost=+v('gB')||0;s.freeSet=+v('fS')||1;s.freeQ=+v('fQ')||10;
 s.mix={e:+v('mE')||0,m:+v('mM')||0,h:+v('mH')||0};save();render();toast('บันทึกแล้ว')}
function trSv(){D.tracks.forEach((t,i)=>{t.min=+v('tm'+i)||180;t.pass=+v('tp'+i)||80;t.res=+v('tv'+i)||60});
 save();render();toast('บันทึกแล้ว')}
function sjSv(){D.subjects.filter(s=>!s.old).forEach((x,i)=>{x.name=v('vn'+i)||x.name;x.grp=v('vg'+i);x.n=+v('vq'+i)||0});
 save();render();toast('บันทึกวิชาแล้ว')}
function aB(){
 return `<div class="grid g2">
 <div class="card"><h2>สำรองข้อมูล</h2><p class="mu">ดาวน์โหลดทั้งระบบเป็นไฟล์ JSON</p>
  <button class="btn btn-p" style="width:100%;margin-top:12px" onclick="exAll()">ดาวน์โหลดไฟล์สำรอง</button>
  <button class="btn btn-o" style="width:100%;margin-top:8px" onclick="exQ()">ส่งออกเฉพาะคลังข้อสอบ</button>
  <button class="btn btn-o" style="width:100%;margin-top:8px" onclick="exU()">ส่งออกรายชื่อสมาชิก (CSV)</button></div>
 <div class="card"><h2>กู้คืนข้อมูล</h2><p class="mu"><b style="color:var(--bad)">ข้อมูลปัจจุบันจะถูกเขียนทับทั้งหมด</b></p>
  <input type="file" accept="application/json" id="imf" style="margin-top:12px">
  <button class="btn btn-d" style="width:100%;margin-top:10px" onclick="imp()">กู้คืน</button>
  <hr style="margin:18px 0;border:0;border-top:1px solid var(--bd)">
  <button class="btn btn-r" style="width:100%" onclick="rst()">ล้างข้อมูลทั้งหมด</button></div></div>
 <div class="card" style="margin-top:16px"><h2>สรุปข้อมูล</h2>
  <span class="chip">สมาชิก ${D.users.length}</span><span class="chip">ข้อสอบ ${D.questions.length}</span>
  <span class="chip">ข้อสอบเก่า ${D.questions.filter(q=>sbj(q.subj).old).length}</span>
  <span class="chip">บทเรียน ${D.lessons.length}</span><span class="chip">สื่อ ${D.settings.media.length}</span>
  <span class="chip">หนังสือ ${D.books.length}</span>
  <p class="mu" style="margin-top:10px">ขนาดข้อมูล ~${(JSON.stringify(D).length/1024/1024).toFixed(2)} MB (localStorage จำกัดราว 5 MB)</p></div>`}
function dl(n,t,ty){const b=new Blob([t],{type:ty||'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
function exAll(){dl(`naihoi-backup-${tday()}.json`,JSON.stringify(D));toast('ดาวน์โหลดแล้ว')}
function exQ(){dl(`naihoi-questions-${tday()}.json`,JSON.stringify(D.questions.map(({id,active,...r})=>r),null,1));toast('ส่งออกแล้ว')}
function exU(){const r=[['รหัส','ชื่อ','สกุล','อีเมล','โทร','วันเกิด','นายสิบหมดอายุ','นายร้อยหมดอายุ']].concat(
 D.users.filter(u=>u.role!=='admin').map(u=>[u.code||'',u.name,u.sur||'',u.email||'',u.tel||'',u.birth||'',
  u.access?.sg?.on&&u.access.sg.expire?thD(u.access.sg.expire):'-',
  u.access?.cd?.on&&u.access.cd.expire?thD(u.access.cd.expire):'-']));
 dl(`naihoi-members-${tday()}.csv`,'\ufeff'+r.map(x=>x.join(',')).join('\n'),'text/csv');toast('ส่งออกแล้ว')}
function imp(){const f=document.getElementById('imf').files[0];if(!f)return toast('เลือกไฟล์ก่อน');
 const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.users||!o.questions)return toast('ไฟล์ไม่ถูกต้อง');
  D=o;D.session=null;save();location.reload()}catch(e){toast('อ่านไฟล์ไม่สำเร็จ')}};r.readAsText(f)}
function rst(){modal(`<h2 style="color:var(--bad)">ล้างข้อมูลทั้งหมด?</h2><p class="mu">สมาชิก ข้อสอบ สื่อ ทั้งหมดจะหายถาวร</p>
 <button class="btn btn-r" style="width:100%;margin-top:14px" onclick="localStorage.removeItem('${KEY}');location.reload()">ยืนยัน</button>
 <button class="btn btn-o" style="width:100%;margin-top:8px" onclick="cm()">ยกเลิก</button>`)}

/* security: ปิด devtools shortcut เบื้องต้น + กันลากไฟล์ */
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key==='F12')e.preventDefault()});
init().then(render);
</script>
</body>
</html>
